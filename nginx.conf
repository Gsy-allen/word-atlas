# Static SPA served by nginx. Single server block, no special cases.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    # Compress text assets. Media (png/jpg/webp/wav/mp3/m4a) is already compressed,
    # so there is no point gzipping it.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json;

    # Hashed build assets (Vite emits content-hashed filenames) never change,
    # so cache them hard.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker and manifest MUST NOT be cached long, or updates never
    # reach returning visitors.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths return index.html so client-side routing works
    # and a hard refresh on a sub-route does not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
